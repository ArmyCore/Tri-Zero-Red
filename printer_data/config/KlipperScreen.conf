[preheat PLA]
extruder: 165
heater_bed: 60
gcode:
  STATUS_HEATING

[preheat ABS]
gcode: ABS_HEAT
  STATUS_HEATING

[preheat cooldown]
gcode:
  M84
  M107
  M106 S0
  SET_FAN_SPEED FAN=Aux_Fan SPEED=0
  STATUS_OFF
  SET_IDLE_TIMEOUT timeout=1800

