[mcu]
#####################################################################
# Obtain definition by "ls -l /dev/serial/by-id/"
#####################################################################
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_5700440017504D5930313820-if00

[stepper_y]
step_pin: PC8
dir_pin: PC9
enable_pin: !PA15
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 120
position_max: 120
homing_speed: 35                                                    # for sensorless homing it is recommended not to go above 40mm/s   
homing_retract_dist: 0
homing_positive_dir: true

[stepper_x]
step_pin: PA10
dir_pin: PA14
enable_pin: !PA13
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 120
position_max: 120
homing_speed: 35                                                    # for sensorless homing it is recommended not to go above 40mm/s   
homing_retract_dist: 0
homing_positive_dir: true

[stepper_z]
step_pin: PC6
dir_pin: PC7
enable_pin: !PA9
microsteps: 64
rotation_distance: 32
endstop_pin: ^PC3
position_max: 113
position_min: -3
homing_speed: 10
second_homing_speed: 3.0
homing_retract_dist: 2.0
homing_positive_dir: false

[stepper_z1]
step_pin: PB12
dir_pin: PB11
enable_pin: !PA8
rotation_distance: 32
microsteps: 64
full_steps_per_rotation: 200

[stepper_z2]
step_pin: PB0
dir_pin: !PB1
enable_pin: !PC4
rotation_distance: 32
microsteps: 64
full_steps_per_rotation: 200

########################################
# TMC2209 configuration
########################################

[tmc2209 stepper_y]
uart_pin: PD9
interpolate: False
run_current: 0.700
stealthchop_threshold: 0 
diag_pin: PD3 
driver_SGTHRS: 98

[tmc2209 stepper_x]
uart_pin: PD8
interpolate: False
run_current: 0.700
stealthchop_threshold: 0 
diag_pin: PD2
driver_SGTHRS: 96

[tmc2209 stepper_z]
uart_pin: PB10
run_current: 0.75
#diag_pin: PC3
interpolate: False

[tmc2209 stepper_z1]
uart_pin: PB2
interpolate: False
run_current: 0.75

[tmc2209 stepper_z2]
uart_pin: PA6
interpolate: False
run_current: 0.75

#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA5
sensor_type: Generic 3950
sensor_pin: PA0
smooth_time: 3.0
min_temp: 0
max_temp: 120
control: pid                                                         # Do PID calibration after initial checks
pid_kp: 68.453
pid_ki: 2.749
pid_kd: 426.122

#####################################################################
# Fan Control
#####################################################################

[controller_fan Circulation_Fan]
pin: PA4
max_power: 1.0
#min_temp: 10
#max_temp: 100
kick_start_time: 0.5
off_below: 0.1
heater:
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2
#fan_speed: 1.0

#####################################################################
# Temperature Sensor
#####################################################################

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PA1

#####################################################################
# Neopixel
#####################################################################

[neopixel chamber_lights]
pin: PC11
chain_count: 10
color_order: GRB
initial_RED: 0.8
initial_GREEN: 0.8
initial_BLUE: 0.8

[output_pin glowstick]
pin: PA7