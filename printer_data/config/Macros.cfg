#####################################################################
# Print Start and End
#####################################################################

[gcode_macro PRINT_START]
gcode:
  # This part fetches data from your slicer. Such as bed temp, extruder temp, chamber temp and size of your printer.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set soak_extruder = params.EXTRUDER|int %}
  {% set soak_extruder = soak_extruder - 60 %}
  {% set brush_extruder = params.EXTRUDER|int %}
  {% set brush_extruder = brush_extruder - 30 %}
  {% set FILAMENT_PROFILE = params.FILAMENT_PROFILE|default("none")|string %}
  {% set bed_type = params.BED_TYPE|default("none")|string %}
  {% set bed_soak_check = params.BED|int %}
  {% set bed_soak_check = bed_soak_check - 4 %}
  {% set target_chamber = params.CHAMBER|default("45")|int %}    #Uncomment after adding Chamber temp sensor
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  _LED_Status_Busy
  
  
  #BED_MESH_PROFILE LOAD=default

  #BED_OFFSET F_P=FILAMENT_PROFILE B_T=bed_type

  #{% if FILAMENT_PROFILE == "ABS-GF" %}
  #  SET_GCODE_OFFSET Z=0.0 MOVE=1
  #{% elif FILAMENT_PROFILE == "ABS" %}
  #  SET_GCODE_OFFSET Z=0.0 MOVE=1
  #{% else %}  
  #  {% if bed_type == "High Temp Plate" %}
  #    SET_GCODE_OFFSET Z=0.33 MOV=1
  #  {% elif bed_type == "Textured PEI Plate" %}
  #    SET_GCODE_OFFSET Z=0.0 MOVE=1
  #  {% elif bed_type == "Cool Plate" %}
  #    SET_GCODE_OFFSET Z=0.135 MOVE=1
  #  {% elif bed_type == "Engineering Plate" %}
  #    SET_GCODE_OFFSET Z=0.22 MOVE=1
  #  {% else %}
  #    SET_GCODE_OFFSET Z=0.0 MOVE=1
  #  {% endif %}
  #{% endif %}
  # Checks if the bed temp is higher than 90c - if so then trigger a heatsoak
  {% if params.BED|int > 90 %}
    M106 S255                                         # Turns on the PT-fan
    SET_FAN_SPEED FAN=Aux_Fan SPEED=0.75               # Turns on chamber fan
    M104 S{soak_extruder}
    ##  Uncomment if you have a Nevermore.
    #SET_PIN PIN=nevermore VALUE=1                    # Turns on the nevermore
    
    #G1 X{x_wait} Y{y_wait} Z85 F9000                  # Goes to center of the bed
    _LED_Status_heating
    M190 S{target_bed}                                # Sets target temp for the bed
    {% if printer["temperature_sensor chamber"].temperature < target_chamber %}
      TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber}   # Waits for chamber to reach desired temp    #Uncomment after adding Chamber temp sensor
      M117 Long Soak
      G4 P600000
    {% else %}
      M117 Short Soak
      G4 P5000
    {% endif %}  
    SET_FAN_SPEED FAN=Aux_Fan SPEED=0
    #Smart_Park
    UPDATE_DELAYED_GCODE ID=_CLEAR_DISPLAY DURATION=10
    
  # If the bed temp is not over 90c then it skips the heatsoak and just heats up to set temp with a 5min soak.
  {% else %}
    #G1 X{x_wait} Y{y_wait} Z15 F9000                # Goes to center of the bed
    {% if printer.heater_bed.temperature > bed_soak_check %}
      {% set soak_Interval = 18000 %}
      M117 Short Interval
    {% else %}
      {% set soak_Interval = 180000 %}
      M117 Long Interval
    {% endif %}  
    M190 S{target_bed}                              # Sets target temp for the bed
      G4 P{soak_Interval}                                      # Waits 5 min for the bedtemp to stabilize
      UPDATE_DELAYED_GCODE ID=_CLEAR_DISPLAY DURATION=10

  {% endif %}

  #SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1   # Turns on Filament Sensor
  SET_FILAMENT_SENSOR SENSOR=head_filament_sensor ENABLE=1   # Turns on Filament Sensor
  # Homes the printer and sets absolute positioning
  M104 S{target_extruder}
  CG28                   # Full home (XYZ
  G92 E0
  FORCE_MOVE STEPPER=extruder DISTANCE=-3 VELOCITY=1200
  #G1 E-1 F3600
  Z_TILT_ADJUST
  G90                   # Absolut position
  #G28 Z
  #_klicky_status_homing
  #ADAPTIVE_BED_MESH_CALIBRATE
  #Dock_probe_unlock
  Smart_Park
  # Heats up the nozzle up to target via slicer
  _LED_Status_heating
  M106 S0                                              # Turns off the PT-fan
  M109 S{target_extruder}                           # Heats the nozzle to your print temp
  _LED_STATUS_Ready
  #Voron_Purge
  Line_Purge
  TOOLRGBTIMELAPSE
  _LED_STATUS_PRINTING
  M107

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customize for your slicer of choice
gcode: 
  M400                           ; wait for buffer to clear
  G92 E0                         ; zero the extruder
  G1 E-2.2 F3600                 ; retract filament
  G91                            ; relative positioning                      


  #   Get Boundaries
  {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
  {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
  {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}

  #   Check end position to determine safe direction to move
  {% if printer.toolhead.position.x < (max_x - 20) %}
      {% set x_safe = 20.0 %}
  {% else %}
      {% set x_safe = -20.0 %}
  {% endif %}

  {% if printer.toolhead.position.y < (max_y - 20) %}
      {% set y_safe = 20.0 %}
  {% else %}
      {% set y_safe = -20.0 %}
  {% endif %}

  {% if printer.toolhead.position.z < (max_z - 30) %}
      {% set z_safe = (max_z - 30.0) - printer.toolhead.position.z %}
  {% else %}
      {% set z_safe = (max_z - 3) - printer.toolhead.position.z %}
  {% endif %}
  
  G0 Z{z_safe} F3600    ; move nozzle up
  G0 X{x_safe} Y{y_safe} F20000    ; move nozzle to remove stringing
  TURN_OFF_HEATERS
  #SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
  SET_FILAMENT_SENSOR SENSOR=head_filament_sensor ENABLE=0
  M107                           ; turn off fan
  G90                            ; absolute positioning
  G0 X115 Y115 F3600          ; park nozzle at rear
  {% set z_pos = printer.toolhead.position.z %}
  #M84
  SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
  SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
  SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=XY
  _LED_status_ready

#####################################################################
# Homing
#####################################################################

[gcode_macro CG28]
gcode:
  {% if "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes and "z" in printer.toolhead.homed_axes %}
  G28 Z
  {% endif %}
  {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes %}
  G28
  {% endif %}
    
[gcode_macro LG28]   #Used in Print Start Macro to keep the probe attached.
gcode:
  {% if "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes and "z" in printer.toolhead.homed_axes %}
  Attach_Probe_Lock
  G28 Z
  {% endif %}
  {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes %}
  G28 X Y
  Attach_probe_lock
  G28 Z
  {% endif %}

#####################################################################
#   Pause and Resume
#####################################################################

[pause_resume]

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
  # Parameters
  {% set z = params.Z|default(10)|int %}                                                   ; z hop amount

  {% if printer['pause_resume'].is_paused|int == 0 %}
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                              ; set z hop variable for reference in resume macro
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}    ; set hotend temp variable for reference in resume macro

      #SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0                                  ; disable filament sensor
      SET_FILAMENT_SENSOR SENSOR=head_filament_sensor ENABLE=0
      SAVE_GCODE_STATE NAME=PAUSE                                                          ; save current print position for resume
      BASE_PAUSE                                                                           ; pause print
      {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       ; check that zhop doesn't exceed z max
          G91                                                                              ; relative positioning
          G1 Z{z} F900                                                                     ; raise Z up by z hop amount
      {% else %}
          { action_respond_info("Pause zhop exceeds maximum Z height.") }                  ; if z max is exceeded, show message and set zhop value for resume to 0
          SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
      {% endif %}
      G90                                                                                  ; absolute positioning
      G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} F6000   ; park toolhead at front center
      SAVE_GCODE_STATE NAME=PAUSEPARK                                                      ; save parked position in case toolhead is moved during the pause (otherwise the return zhop can error)
      M104 S0                                                                              ; turn off hotend
      SET_IDLE_TIMEOUT TIMEOUT=43200                                                       ; set timeout to 12 hours
  {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
  # Parameters
  {% set e = params.E|default(2.5)|int %}                                          ; hotend prime amount (in mm)

  {% if printer['pause_resume'].is_paused|int == 1 %}
      #SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1                          ; enable filament sensor
      SET_FILAMENT_SENSOR SENSOR=head_filament_sensor ENABLE=1
      TOOLRGBRUN                                                                   ; reset LCD color
      SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}  ; set timeout back to configured value
      {% if etemp > 0 %}
          M109 S{etemp|int}                                                        ; wait for hotend to heat back up
      {% endif %}
      RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                     ; go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)
      G91                                                                          ; relative positioning
      M83                                                                          ; relative extruder positioning
      {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
          G1 Z{zhop * -1} E{e} F900                                                ; prime nozzle by E, lower Z back down
      {% else %}
          G1 Z{zhop * -1} F900                                                     ; lower Z back down without priming (just in case we are testing the macro with cold hotend)
      {% endif %}
      RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                          ; restore position
      BASE_RESUME                                                                  ; resume print
  {% endif %}

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
  SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout} ; set timeout back to configured value
  CLEAR_PAUSE
  SDCARD_RESET_FILE
  PRINT_END
  BASE_CANCEL_PRINT

[gcode_macro M600]
gcode:
  TOOLHEADRGB R=0 G=1 B=0  ; Turn LCD green
  PAUSE                ; Pause

