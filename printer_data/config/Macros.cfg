[gcode_macro ABS_Heat]
gcode:
    SET_IDLE_TIMEOUT TIMEOUT=7200
    M140 S100                                         #Turns on Heated bed
    M104 S195                                         #Turns on Hotend
    M106 S255                                         # Turns on the PT-fan
    SET_FAN_SPEED FAN=Aux_Fan SPEED=0.75               # Turns on chamber fan
    _LED_Status_heating
    

[gcode_macro LOAD_FILAMENT]
gcode:
  #{% if printer[printer.toolhead.extruder].temperature <= printer.configfile.settings.extruder.min_extrude_temp %}
  #  M109 T0 S210                   ; set extruder temp and wait 
  #{% endif %}
  # M83                            ; set extruder to relative
  # G1 E30 F300                    ; load
  # G1 E15 F150                    ; prime nozzle with filament
  # G1 E-2 F60                    ; prime nozzle with filament
  # M82                            ; set extruder to absolute
  FILAMENT_LOAD

    
[gcode_macro UNLOAD_FILAMENT]
gcode:
   #M83                            ; set extruder to relative
   #G1 E10 F300                    ; extrude a little to soften tip
   #G1 E-40 F1800                  ; retract some, but not too much or it will jam
   #M82                            ; set extruder to absolute
   #CLEAR_ACTIVE_SPOOL
   FILAMENT_UNLOAD

[gcode_macro BED_LEVEL]
gcode:
  CG28
  #BED_SCREWS_ADJUST
  SCREWS_TILT_CALCULATE

[gcode_macro Z_OFFSET]
gcode:
  CG28
  G1 X60 Y60 Z10 F1500
  #Z_ENDSTOP_CALIBRATE  #Used for limit switch z calibrations
  PROBE_CALIBRATE  #Used for Probe based Z-offset

[gcode_macro MOVE_BED]
description: Move the toolhead without homing
## Move the bed without homing
########## Parameters ##########
## Z: The Z distance to move by (default: -25) mm
variable_bed_height: 120
gcode:
  {% set z = params.Z|default(0)|float %}
    G90
    SET_KINEMATIC_POSITION Z={(printer.toolhead.axis_maximum.z/2)} X={(printer.toolhead.axis_maximum.x/2)} Y={(printer.toolhead.axis_maximum.y/2)}
    G0 Z{(printer.toolhead.axis_maximum.z/2)+z}
    M84

[gcode_macro BRUSH_NOZZLE]
# heat nozzle for best results
variable_x1: 88 # left of brush   <<<edit this value>>>
variable_x2: 120 # right or brush  <<<edit this value>>>
variable_y1: 120 # y value         <<<edit this value>>>
variable_z1: 4.2 # nozzle height   <<<edit this value>>>
gcode:
    M400  ;wait for buffer to clear
    _LED_status_cleaning
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28         ;home axes before travel moves
    {% endif %}

    G90
    G0 Z5 F3600     ;ensure nozzle is above endstop pin
    G0 X{x2} Y{y1}  ;right position
    G0 Z{z1}        ;move down, ready for brushing
    
    M117 Brushing Nozzle
    G0 X{x1} F5000  ;move left
    G0 X{x2} F5000  ;move right
    G0 X{x1}        ;move left
    G0 X{x2}        ;move right
    G0 X{x1}        ;move left
    G0 X{x2}        ;move right
    G0 X{x1}        ;move left
    G0 X{x2}        ;move right
    G0 X{x1}        ;move left
    G0 Z5 F3600     ;raise nozzle when done
    M117 Nozzle Cleaned
    _LED_status_ready

    
