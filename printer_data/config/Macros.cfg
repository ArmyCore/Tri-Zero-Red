[gcode_macro TOOLHEADRGB]
gcode:
  {% set r = params.R|default(0)|float %}
  {% set g = params.G|default(0)|float %}
  {% set b = params.B|default(0)|float %}

  SET_LED LED="right_rgb" RED={r} GREEN={g} BLUE={b} TRANSMIT=1
  SET_LED LED="left_rgb" RED={r} GREEN={g} BLUE={b} TRANSMIT=1
    
[gcode_macro TOOLRGBRUN]
gcode:
  SET_LED LED="right_rgb" RED=.5 GREEN=.5 BLUE=.5 TRANSMIT=1
  SET_LED LED="left_rgb" RED=.5 GREEN=.5 BLUE=.5 TRANSMIT=1

[gcode_macro TOOLRGBTIMELAPSE]
gcode:
  SET_LED LED="right_rgb" RED=.5 GREEN=.5 BLUE=.5 TRANSMIT=1
  SET_LED LED="left_rgb" RED=0 GREEN=0 BLUE=0 TRANSMIT=1
    
